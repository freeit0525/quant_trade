}

// 数据库预计算的 MACD 参数组列后缀（与后端 MACD_GROUPS 一致，空=默认 12/26/9）
const MACD_SUFFIXES = ['', '_6_12_5', '_3_8_3', '_10_20_7'];

// 把 Date 转成 YYYYMMDD（东方财富 beg/end 参数格式）
function dateToYYYYMMDD(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}${m}${day}`;
}

// YYYYMMDD 按自然日偏移（正=向后，负=向前）
function addDays(dateStr, deltaDays) {
  const y = +dateStr.slice(0, 4), m = +dateStr.slice(4, 6), d = +dateStr.slice(6, 8);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + deltaDays);
  return dateToYYYYMMDD(dt);
}

// 根据当前模式构造请求参数 { beg, end, lmt }
function buildRangeParams() {
  const mode = getRangeMode();
  if (mode === 'all') {
    // 自上市以后：A股最早上市1990-12，覆盖全部历史
    return { beg: '19900101', end: dateToYYYYMMDD(new Date()), lmt: 10000 };
  }
  if (mode === 'period') {
    const begInput = document.getElementById('begDate').value;
    const endInput = document.getElementById('endDate').value;
    if (!begInput || !endInput) throw new Error('请选择起止日期');
    const beg = begInput.replace(/-/g, '');
    const end = endInput.replace(/-/g, '');
    if (beg > end) throw new Error('起始日期不能晚于结束日期');
    return { beg, end, lmt: 10000 };
  }
  // 最近模式：交易日约占自然日 5/7，加 30 天节假日缓冲
  const tradingDays = estimateTradingDays();
  const naturalDays = Math.ceil(tradingDays * 1.5) + 30;
  const begDate = new Date();
  begDate.setDate(begDate.getDate() - naturalDays);
  return { beg: dateToYYYYMMDD(begDate), end: dateToYYYYMMDD(new Date()), lmt: tradingDays };
}

// 读取股票数据：默认只读本地库（秒回、不联网）；syncFirst=true 时先联网增量同步再读库
async function fetchStock(syncFirst = false) {
  clearError();
  const infoEl = document.getElementById('stockInfo');
  const pickerEl = document.getElementById('stockPicker');
  const picked = StockPicker.getValue(pickerEl);
  const input = StockPicker.getInput(pickerEl);
  if (!picked && !input) { showError('请选择股票或输入代码/名称'); return; }

  infoEl.textContent = syncFirst ? '正在从数据源同步最新数据（联网，可能需要一些时间）...' : '正在读取本地数据库...';
  try {
    let code, name;
    if (picked) {
      code = picked.code;
      name = picked.name;
    } else if (/^\d{6}$/.test(input)) {
      code = input;
    } else {
      const m = input.match(/[（(](\d{6})[)）]/);
      if (m) { code = m[1]; name = input.replace(/\s*[（(]\d{6}[)）]\s*$/, '').trim(); }
    }
    if (!code) {
      // 名称 → 代码（从本地 stock_info 联想匹配）
      const res = await fetch(`${API_BASE}/api/stock_catalog?keyword=${encodeURIComponent(input)}`);
      const data = await res.json();
      const list = data.data || [];
      if (!list.length) { showError('未找到匹配的A股'); infoEl.textContent = ''; return; }
      const match = list.find(r => r.Name === input) || list[0];
      code = match.Code;
      name = match.Name;
    }

    const range = buildRangeParams();

    // MACD/MA 等滚动指标依赖长历史预热（EMA26 约需 200+ 交易日收敛）。
    // 请求时把开始日期前移约 380 个自然日，前端用全量数据计算指标后再裁剪回用户范围，
    // 避免短区间拉取时指标因起点不同与行情软件（全量历史计算）不一致。
    const warmupDays = 380;
    const warmupBeg = addDays(range.beg, -warmupDays);

    // 手动同步：先走联网增量拉取（查库→补缺口→入库），失败仅告警，不阻断后续读库
    if (syncFirst) {
      try {
        const syncRes = await fetch(`${API_BASE}/api/kline?code=${code}&beg=${warmupBeg}&end=${range.end}`);
        const syncData = await syncRes.json();
        if (syncData.error) console.warn('同步失败:', syncData.error);
      } catch (e) {
        console.warn('同步失败:', e);
      }
    }

    // 纯读本地数据库（MACD/MA/RSI/KDJ/量比等指标已由后端按全量历史预计算入库，无需联网）
    const url = `${API_BASE}/api/kline_db?code=${code}&beg=${warmupBeg}&end=${range.end}`;
    const res = await fetch(url);
    const data = await res.json();

    if (!data.data || data.data.length === 0) {
      showError((data.error || '未获取到K线数据，请检查代码是否正确') + '；若本地库无该股数据，请点「同步最新数据」联网拉取一次');
      infoEl.textContent = '';
      return;
    }

    name = name || data.stock?.name || code;
    const klines = data.data;
    // 每条记录: date/open/close/high/low/volume/amount/turnover/pct_change/change/amplitude + macd 预置列
    const ohlc = klines.map(k => {
      const o = {
        date: k.date, open: +k.open, close: +k.close, high: +k.high, low: +k.low,
        volume: +k.volume, amount: +k.amount, amplitude: +k.amplitude, pctChange: +k.pct_change, change: +k.change, turnover: +k.turnover,
        volumeRatio: k.volume_ratio != null ? +k.volume_ratio : null
      };
      // 保留数据库基于全量历史算好的 MACD（各参数组），优先直接使用
      MACD_SUFFIXES.forEach(s => {
        o[`macd_dif${s}`] = k[`macd_dif${s}`] != null ? +k[`macd_dif${s}`] : null;
        o[`macd_dea${s}`] = k[`macd_dea${s}`] != null ? +k[`macd_dea${s}`] : null;
        o[`macd_hist${s}`] = k[`macd_hist${s}`] != null ? +k[`macd_hist${s}`] : null;
      });
      return o;
    });

    // 剔除今日未收盘的K线（若今日是交易日且当前在盘中或之前）
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    let completeAll = ohlc;
    if (ohlc.length > 0 && ohlc[ohlc.length - 1].date === todayStr) {
      completeAll = ohlc.slice(0, -1);
    }

    // 计算预热根数：用户选择起始日期之前的数据仅用于指标预热，不参与展示/回测
    const begStr = String(range.beg).replace(/-/g, '');
    let warmupIdx = completeAll.findIndex(k => String(k.date).replace(/-/g, '') >= begStr);
    if (warmupIdx < 0) warmupIdx = 0;
    const completeOhlc = completeAll.slice(warmupIdx);

    window.__backtestOhlc = completeOhlc;
    window.__backtestAllCloses = completeAll.map(k => k.close); // 含预热，供 MACD 全量计算
    window.__backtestWarmup = warmupIdx;
    window.__backtestStock = { code, name };
    window.__backtestAllOhlc = completeAll; // 含预热与可能未收盘的当日

    const lastClose = completeOhlc[completeOhlc.length - 1].close;
    const firstDate = completeOhlc[0].date;
    const lastDate = completeOhlc[completeOhlc.length - 1].date;
    // 库中数据滞后提示：最新K线比请求结束日晚超过 5 个自然日才提示（周末/短假正常差异不提示）
    const reqEndStr = String(range.end).replace(/-/g, '');
    const dbLastStr = String(ohlc[ohlc.length - 1].date).replace(/-/g, '');
    const gapDays = Math.round((new Date(reqEndStr.slice(0,4), +reqEndStr.slice(4,6) - 1, +reqEndStr.slice(6,8))
      - new Date(dbLastStr.slice(0,4), +dbLastStr.slice(4,6) - 1, +dbLastStr.slice(6,8))) / 86400000);
    const staleHint = gapDays > 5
      ? `<br><span style="color:#ff9800">⚠ 本地库数据截至 ${ohlc[ohlc.length - 1].date}（滞后 ${gapDays} 天），若需最新行情请点「同步最新数据」</span>`
      : '';
    infoEl.innerHTML = `<strong style="color:#1a73e8">${name} (${code})</strong> | 共 ${completeOhlc.length} 个交易日 | 区间: ${firstDate} ~ ${lastDate} | 最新收盘: ${lastClose.toFixed(2)}${staleHint}`;
  } catch (e) {
    // Failed to fetch 常见原因：本地服务(server.py)未启动，或端口被占用
    const hint = (e instanceof TypeError && e.message === 'Failed to fetch')
      ? '（请确认已运行 python server.py 启动本地服务，且端口8000未被占用）'
      : '';
    showError('读取失败: ' + e.message + hint);
    infoEl.textContent = '';
  }
}

// ============ MA计算 ============
function calcMA(values, period) {
  const ma = new Array(values.length).fill(null);
  for (let i = 0; i < values.length; i++) {
    if (i < period - 1) continue;
    let sum = 0;
    for (let j = i - period + 1; j <= i; j++) sum += values[j];
    ma[i] = sum / period;
  }
  return ma;
}

// RSI指标（默认周期14）
function calcRSI(closes, period = 14) {
  const rsi = new Array(closes.length).fill(null);
  if (closes.length < period + 1) return rsi;
  let gainSum = 0, lossSum = 0;
  for (let i = 1; i <= period; i++) {
    const ch = closes[i] - closes[i - 1];
    if (ch >= 0) gainSum += ch; else lossSum -= ch;
  }
  let avgGain = gainSum / period;
  let avgLoss = lossSum / period;
  rsi[period] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  for (let i = period + 1; i < closes.length; i++) {
    const ch = closes[i] - closes[i - 1];
    const gain = ch > 0 ? ch : 0;
    const loss = ch < 0 ? -ch : 0;
    avgGain = (avgGain * (period - 1) + gain) / period;
    avgLoss = (avgLoss * (period - 1) + loss) / period;
    rsi[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  }
  return rsi;
}

// KDJ指标（默认9,3,3）
function calcKDJ(ohlc, n = 9, m1 = 3, m2 = 3) {
  const len = ohlc.length;
  const k = new Array(len).fill(50);
  const d = new Array(len).fill(50);
  const j = new Array(len).fill(50);
  let prevK = 50, prevD = 50;
  for (let i = 0; i < len; i++) {
    if (i < n - 1) { k[i] = 50; d[i] = 50; j[i] = 50; continue; }
    let hn = -Infinity, ln = Infinity;
    for (let p = i - n + 1; p <= i; p++) {
      if (ohlc[p].high > hn) hn = ohlc[p].high;
      if (ohlc[p].low < ln) ln = ohlc[p].low;
    }
    const rsv = hn === ln ? 0 : (ohlc[i].close - ln) / (hn - ln) * 100;
    const curK = (2 * prevK + rsv) / m1;
    const curD = (2 * prevD + curK) / m2;
    const curJ = 3 * curK - 2 * curD;
    k[i] = curK; d[i] = curD; j[i] = curJ;
    prevK = curK; prevD = curD;
  }
  return { k, d, j };
}

// 布林带指标（默认20日，2倍标准差）
function calcBOLL(closes, n = 20, k = 2) {
  const len = closes.length;
  const mid = new Array(len).fill(null);
  const upper = new Array(len).fill(null);
  const lower = new Array(len).fill(null);
  for (let i = n - 1; i < len; i++) {
    let sum = 0;
    for (let j = i - n + 1; j <= i; j++) sum += closes[j];
    const m = sum / n;
    let sqSum = 0;
    for (let j = i - n + 1; j <= i; j++) sqSum += (closes[j] - m) ** 2;
    const sd = Math.sqrt(sqSum / n);
    mid[i] = m;
    upper[i] = m + k * sd;
    lower[i] = m - k * sd;
  }
  return { mid, upper, lower };
}

// BIAS乖离率指标（默认6日）
function calcBIAS(closes, n = 6) {
  const bias = new Array(closes.length).fill(null);
  for (let i = n - 1; i < closes.length; i++) {
    let sum = 0;
    for (let j = i - n + 1; j <= i; j++) sum += closes[j];
    const ma = sum / n;
    bias[i] = (closes[i] - ma) / ma * 100;
  }
  return bias;
}

// ============ 量能指标 ============
// OBV能量潮：涨日累加成交量、跌日累减、平盘不变
function calcOBV(ohlc) {
  const obv = new Array(ohlc.length).fill(0);
  for (let i = 0; i < ohlc.length; i++) {
    if (i === 0) { obv[i] = ohlc[i].volume || 0; continue; }
    if (ohlc[i].close > ohlc[i - 1].close) obv[i] = obv[i - 1] + (ohlc[i].volume || 0);
    else if (ohlc[i].close < ohlc[i - 1].close) obv[i] = obv[i - 1] - (ohlc[i].volume || 0);
    else obv[i] = obv[i - 1];
  }
  return obv;
}

// VR成交量变异率：VR = (上涨日量+0.5×平盘日量) / (下跌日量+0.5×平盘日量) × 100
function calcVR(ohlc, n = 26) {
  const len = ohlc.length;
  const vr = new Array(len).fill(null);
  for (let i = n; i < len; i++) {
    let up = 0, down = 0, flat = 0;
    for (let j = i - n + 1; j <= i; j++) {
      const ch = ohlc[j].close - ohlc[j - 1].close;
      const v = ohlc[j].volume || 0;
      if (ch > 0) up += v;
      else if (ch < 0) down += v;
      else flat += v;
    }
    const denom = down + 0.5 * flat;
    vr[i] = denom === 0 ? (up > 0 ? 999 : 100) : (up + 0.5 * flat) / denom * 100;
  }
  return vr;
}

// ============ 策略信号生成 ============
// 生成每日信号：返回数组，每个元素为 'buy' | 'sell' | null
// flatFilter：横盘时不买入
// fastSell：MACD一阶速率<负阈值则卖（OR）
// ma5Sell：MA5一阶下降则卖（OR）
// aboveWaterOnly：水上（MACD柱>0）时增强卖出（快速卖出/MA5拐头）不生效，只认原策略死叉
// buyStrength：买入信号需MACD柱≥阈值才生效（过滤弱金叉）
function generateSignals(strategy, macdResult, ohlc, flatFilter, fastSell, ma5Sell, aboveWaterOnly, buyStrength, trendFilter, volParams, bullBuy) {
  const { dif, dea, macd } = macdResult;
  const n = macd.length;
  const signals = new Array(n).fill(null);
  const sellSource = new Array(n).fill(null); // 标记卖出信号来源：'orig' | 'fast' | 'ma5'
  const blockedBuy = new Array(n).fill(false); // 标记当日被过滤器拦截不可补买（横盘/趋势/强度待确认）
  const vp = volParams || { volN: 5, volBreakN: 20, volMult: 1.5, shrinkMult: 0.5, volTrendN: 20, volRatioBuy: 2, vrN: 26, vrBuyThr: 70, vrSellThr: 150 };
  const vols = ohlc.map(k => k.volume);
  const closes = ohlc.map(k => k.close);

  // 横盘判定：近 window 日 (最高-最低)/均值 < threshold
  const isFlat = new Array(n).fill(false);
  if (flatFilter && flatFilter.enabled) {
    const w = flatFilter.window;
    const thr = flatFilter.threshold / 100;
    for (let i = 0; i < n; i++) {
      if (i < w - 1) { isFlat[i] = false; continue; }
      let hi = -Infinity, lo = Infinity, sum = 0;
      for (let j = i - w + 1; j <= i; j++) {
        if (ohlc[j].high > hi) hi = ohlc[j].high;
        if (ohlc[j].low < lo) lo = ohlc[j].low;
        sum += ohlc[j].close;
      }
      const mean = sum / w;
      const amplitude = (hi - lo) / mean;
      isFlat[i] = amplitude < thr;
    }
  }

  // 原策略信号：按策略类型分发到独立的策略函数
  const handler = STRATEGY_HANDLERS[strategy];
  if (handler) {
    handler({ dif, dea, macd, n, signals, sellSource, ohlc, vols, closes, vp });
  }

  // 快速下跌卖出：MACD一阶速率 < 负阈值即产生卖出信号
  // 水上仅死叉启用时：水上（macd>0）不触发增强卖出，只保留原策略卖出
  if (fastSell && fastSell.enabled) {
    for (let i = 1; i < n; i++) {
      const rate = macd[i] - macd[i - 1];
      if (rate < fastSell.threshold && signals[i] !== 'sell') {
        if (!aboveWaterOnly || macd[i] <= 0) {
          signals[i] = 'sell';
          sellSource[i] = 'fast';
        }
      }
    }
  }

  // MA5拐头卖出：今日MA5 < 昨日MA5（一阶下降）即产生卖出信号
  // 水上仅死叉启用时：水上不触发
  if (ma5Sell && ma5Sell.enabled) {
    const ma5 = calcMA(ohlc.map(k => k.close), 5);
    for (let i = 1; i < n; i++) {
      if (ma5[i] != null && ma5[i - 1] != null && ma5[i] < ma5[i - 1] && signals[i] !== 'sell') {
        if (!aboveWaterOnly || macd[i] <= 0) {
          signals[i] = 'sell';
          sellSource[i] = 'ma5';
        }
      }
    }
  }

  // 金叉强度确认：金叉点不立即买入，等后续MACD柱≥阈值当日才买入；未达标前死叉则取消
  if (buyStrength && buyStrength.enabled) {
    const thr = buyStrength.threshold;
    let pending = false; // 是否有待确认的金叉
    for (let i = 0; i < n; i++) {
      if (signals[i] === 'buy') {
        if (macd[i] >= thr) {
          // 金叉当日柱长已达标，直接买
          pending = false;
        } else {
          // 柱长不足，取消本次买入，进入待确认状态
          signals[i] = null;
          pending = true;
          blockedBuy[i] = true;
        }
      } else if (pending) {
        // 待确认期间：检查是否达标或死叉
        if (macd[i] >= thr) {
          // 柱长达标，当日买入
          signals[i] = 'buy';
          pending = false;
        } else if (signals[i] === 'sell') {
          // 未达标前出现卖出信号（死叉），取消待确认
          pending = false;
        } else {
          // 未达标且非死叉：待确认期间禁止补买
          blockedBuy[i] = true;
        }
        // 注：待确认期间的卖出信号保留，因为若死叉则取消买入资格，死叉本身也不该卖（没仓位）
        // 但若死叉又快速金叉，会重新触发上面的buy逻辑
      }
    }
  }

  // 横盘过滤：仅过滤买入信号（横盘期间整体禁止买入/补买）
  if (flatFilter && flatFilter.enabled) {
    for (let i = 0; i < n; i++) {
      if (isFlat[i]) blockedBuy[i] = true;
      if (signals[i] === 'buy' && isFlat[i]) signals[i] = null;
    }
  }

  // 下降趋势过滤：判定每日是否处于下降趋势，仅过滤买入信号（卖出信号保留，已持仓仍需止损/平仓）
  // 延迟补买机制：金叉日被趋势过滤时进入"待补买"状态，后续趋势转好且仍金叉(DIF>DEA)则补买；期间死叉则取消
  if (trendFilter && trendFilter.enabled) {
    const closes = ohlc.map(k => k.close);
    const mode = trendFilter.mode;
    const ma5 = calcMA(closes, 5);
    const ma10 = calcMA(closes, 10);
    const ma20 = calcMA(closes, 20);
    const ma30 = calcMA(closes, 30);
    const ma60 = calcMA(closes, 60);

    // 判定第i日是否处于下降趋势
    const isDownTrend = (i) => {
      if (mode === 'shortAlign') {
        if (ma5[i] != null && ma10[i] != null && ma20[i] != null) {
          return ma5[i] < ma10[i] && ma10[i] < ma20[i];
        }
        return false;
      } else if (mode === 'shortAlign30') {
        if (ma5[i] != null && ma10[i] != null && ma30[i] != null) {
          return ma5[i] < ma10[i] && ma10[i] < ma30[i];
        }
        return false;
      } else if (mode === 'belowLong') {
        return ma60[i] != null && closes[i] < ma60[i];
      } else if (mode === 'ma60Down') {
        return ma60[i] != null && ma60[i - 1] != null && ma60[i] < ma60[i - 1];
      } else if (mode === 'both') {
        return ma60[i] != null && ma60[i - 1] != null && closes[i] < ma60[i] && ma60[i] < ma60[i - 1];
      }
      return false;
    };

    let pending = false; // 是否有待补买的金叉
    for (let i = 0; i < n; i++) {
      if (signals[i] === 'buy') {
        if (!isDownTrend(i)) {
          // 趋势允许，直接买入
          pending = false;
        } else {
          // 趋势向下，取消本次买入，进入待补买状态
          signals[i] = null;
          pending = true;
          blockedBuy[i] = true;
        }
      } else if (pending) {
        // 待补买期间：检查趋势是否转好且仍金叉
        const stillGolden = dif[i] > dea[i]; // 仍处于金叉状态
        if (stillGolden && !isDownTrend(i)) {
          // 趋势转好且仍金叉，当日补买
          signals[i] = 'buy';
          pending = false;
        } else if (!stillGolden) {
          // 期间死叉，取消待补买
          pending = false;
        } else {
          // 趋势仍向下且未死叉，继续等待（期间禁止补买）
          blockedBuy[i] = true;
        }
      }
    }
  }

  // 多头空仓补买：金叉状态(DIF>DEA)当日无信号且未被过滤器拦截时，标记补买信号，
  // 解决错过金叉信号（如回测起点已处于多头）后整段多头期间空仓不买的问题；
  // 引擎仅在未持仓时执行该信号，不会造成多头期间连续加仓。
  // 仅对以 MACD 金叉（DIF>DEA）为核心买入/持仓依据的策略生效，避免误作用于量能/RSI/BOLL 等策略
  if (bullBuy && BULL_BUY_STRATEGIES.has(strategy)) {
    for (let i = 0; i < n; i++) {
      if (!signals[i] && !blockedBuy[i] && dif[i] > dea[i]) {
        signals[i] = 'buyBull';
      }
    }
  }

  return signals;
}

// ============ 各策略信号生成（独立函数，由 generateSignals 按 strategy 分发） ============
// 每个函数通过 ctx 共享 { dif, dea, macd, n, signals, sellSource, ohlc, vols, closes, vp }

// 策略：MACD速率——MACD柱速率由负转正买入，正转负卖出
function signalRate(ctx) {
  const { macd, n, signals, sellSource } = ctx;
  for (let i = 2; i < n; i++) {
    const r0 = macd[i - 1] - macd[i - 2];
    const r1 = macd[i] - macd[i - 1];
    if (r0 <= 0 && r1 > 0) signals[i] = 'buy';
    else if (r0 > 0 && r1 <= 0) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：MACD金叉——DIF上穿DEA买入，死叉卖出
function signalCross(ctx) {
  const { dif, dea, n, signals, sellSource } = ctx;
  for (let i = 1; i < n; i++) {
    if (dif[i - 1] <= dea[i - 1] && dif[i] > dea[i]) signals[i] = 'buy';
    else if (dif[i - 1] > dea[i - 1] && dif[i] <= dea[i]) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：MACD柱——红柱由无到有买入，红柱转绿卖出
function signalBar(ctx) {
  const { macd, n, signals, sellSource } = ctx;
  for (let i = 1; i < n; i++) {
    if (macd[i - 1] <= 0 && macd[i] > 0) signals[i] = 'buy';
    else if (macd[i - 1] > 0 && macd[i] <= 0) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：三指标共振——MACD金叉 + KDJ低位金叉(K上穿D且K<50) + RSI上穿30，3日内窗口满足任一即买；MACD死叉卖
function signalTriple(ctx) {
  const { dif, dea, n, signals, sellSource, ohlc } = ctx;
  const { k: kk, d: dd } = calcKDJ(ohlc);
  const rsi = calcRSI(ohlc.map(x => x.close));
  const W = 3; // 3日共振窗口
  for (let i = 1; i < n; i++) {
    if (rsi[i] == null) continue;
    // 检查窗口内是否三个条件都满足过
    let macdHit = false, kdjHit = false, rsiHit = false;
    for (let j = Math.max(1, i - W + 1); j <= i; j++) {
      if (dif[j - 1] <= dea[j - 1] && dif[j] > dea[j]) macdHit = true;
      if (kk[j - 1] <= dd[j - 1] && kk[j] > dd[j] && kk[j] < 50) kdjHit = true;
      if (rsi[j - 1] != null && rsi[j - 1] <= 30 && rsi[j] > 30) rsiHit = true;
    }
    // 当日必须是MACD金叉日，且窗口内三个条件都满足过
    const isMacdCrossDay = dif[i - 1] <= dea[i - 1] && dif[i] > dea[i];
    if (isMacdCrossDay && macdHit && kdjHit && rsiHit) signals[i] = 'buy';
    else if (dif[i - 1] > dea[i - 1] && dif[i] <= dea[i]) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：MACD主+RSI过滤——MACD金叉且RSI<50(未超买)才买；RSI>70或MACD死叉卖
function signalMacdRsi(ctx) {
  const { dif, dea, n, signals, sellSource, ohlc } = ctx;
  const rsi = calcRSI(ohlc.map(x => x.close));
  for (let i = 1; i < n; i++) {
    if (rsi[i] == null) continue;
    const macdCross = dif[i - 1] <= dea[i - 1] && dif[i] > dea[i];
    if (macdCross && rsi[i] < 50) signals[i] = 'buy';
    else if (dif[i - 1] > dea[i - 1] && dif[i] <= dea[i]) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
    else if (rsi[i - 1] != null && rsi[i - 1] <= 70 && rsi[i] > 70) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：MACD主+KDJ过滤——MACD金叉且KDJ未超买(K<80)才买；KDJ死叉或MACD死叉卖
function signalMacdKdj(ctx) {
  const { dif, dea, n, signals, sellSource, ohlc } = ctx;
  const { k: kk, d: dd } = calcKDJ(ohlc);
  for (let i = 1; i < n; i++) {
    const macdCross = dif[i - 1] <= dea[i - 1] && dif[i] > dea[i];
    const kdjDeadCross = kk[i - 1] > dd[i - 1] && kk[i] <= dd[i];
    if (macdCross && kk[i] < 80) signals[i] = 'buy';
    else if (dif[i - 1] > dea[i - 1] && dif[i] <= dea[i]) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
    else if (kdjDeadCross) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：KDJ抄底+MACD趋势——KDJ低位金叉(K上穿D且K<20)买入；MACD水上(DIF>DEA)可加仓；MACD死叉全卖
function signalKdjBottom(ctx) {
  const { dif, dea, n, signals, sellSource, ohlc } = ctx;
  const { k: kk, d: dd } = calcKDJ(ohlc);
  for (let i = 1; i < n; i++) {
    const kdjLowCross = kk[i - 1] <= dd[i - 1] && kk[i] > dd[i] && kk[i] < 20;
    const macdAboveWater = dif[i] > dea[i];
    if (kdjLowCross) signals[i] = 'buy';
    else if (dif[i - 1] > dea[i - 1] && dif[i] <= dea[i]) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：RSI+KDJ双底共振——KDJ低位金叉(K上穿D且K<30) 且 RSI<40(超卖区) 才买入；KDJ死叉或RSI>70卖
function signalRsiKdjBottom(ctx) {
  const { n, signals, sellSource, ohlc } = ctx;
  const { k: kk, d: dd } = calcKDJ(ohlc);
  const rsi = calcRSI(ohlc.map(x => x.close));
  for (let i = 1; i < n; i++) {
    if (rsi[i] == null) continue;
    const kdjLowCross = kk[i - 1] <= dd[i - 1] && kk[i] > dd[i] && kk[i] < 30;
    const kdjDeadCross = kk[i - 1] > dd[i - 1] && kk[i] <= dd[i];
    if (kdjLowCross && rsi[i] < 40) signals[i] = 'buy';
    else if (kdjDeadCross) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
    else if (rsi[i - 1] != null && rsi[i - 1] <= 70 && rsi[i] > 70) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：KDJ+RSI超卖共振——K<20且RSI<30同时满足当日买入；K>80或RSI>70卖出
function signalKdjRsiOverSell(ctx) {
  const { n, signals, sellSource, ohlc } = ctx;
  const { k: kk } = calcKDJ(ohlc);
  const rsi = calcRSI(ohlc.map(x => x.close));
  for (let i = 1; i < n; i++) {
    if (rsi[i] == null) continue;
    if (kk[i] < 20 && rsi[i] < 30) signals[i] = 'buy';
    else if (kk[i] > 80) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
    else if (rsi[i - 1] != null && rsi[i - 1] <= 70 && rsi[i] > 70) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：RSI+KDJ双重确认——3日内RSI上穿30 或 KDJ低位金叉(K<50)任一触发即买；RSI>70或KDJ死叉卖
function signalRsiKdjDual(ctx) {
  const { n, signals, sellSource, ohlc } = ctx;
  const { k: kk, d: dd } = calcKDJ(ohlc);
  const rsi = calcRSI(ohlc.map(x => x.close));
  const W = 3;
  for (let i = 1; i < n; i++) {
    if (rsi[i] == null) continue;
    let rsiHit = false, kdjHit = false;
    for (let j = Math.max(1, i - W + 1); j <= i; j++) {
      if (rsi[j - 1] != null && rsi[j - 1] <= 30 && rsi[j] > 30) rsiHit = true;
      if (kk[j - 1] <= dd[j - 1] && kk[j] > dd[j] && kk[j] < 50) kdjHit = true;
    }
    if (rsiHit || kdjHit) signals[i] = 'buy';
    else if (kk[i - 1] > dd[i - 1] && kk[i] <= dd[i]) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
    else if (rsi[i - 1] != null && rsi[i - 1] <= 70 && rsi[i] > 70) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：KDJ J值极值反转——J从<0上穿0轴买入（超卖反转）；J从>100下穿100轴卖出（超买反转）
function signalKdjJ(ctx) {
  const { n, signals, sellSource, ohlc } = ctx;
  const { j: jj } = calcKDJ(ohlc);
  for (let i = 1; i < n; i++) {
    if (jj[i - 1] <= 0 && jj[i] > 0) signals[i] = 'buy';
    else if (jj[i - 1] >= 100 && jj[i] < 100) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：RSI双线——短期RSI(6)上穿长期RSI(24)买入；短期下穿长期卖出
function signalRsiDual(ctx) {
  const { n, signals, sellSource, ohlc } = ctx;
  const rsiShort = calcRSI(ohlc.map(x => x.close), 6);
  const rsiLong = calcRSI(ohlc.map(x => x.close), 24);
  for (let i = 1; i < n; i++) {
    if (rsiShort[i] == null || rsiLong[i] == null) continue;
    if (rsiShort[i - 1] <= rsiLong[i - 1] && rsiShort[i] > rsiLong[i]) signals[i] = 'buy';
    else if (rsiShort[i - 1] > rsiLong[i - 1] && rsiShort[i] <= rsiLong[i]) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：RSI底背离/顶背离——以30日为窗口，价创新低但RSI未破前低→底背离买；价创新高但RSI未破前高→顶背离卖
function signalRsiDivergence(ctx) {
  const { n, signals, sellSource, ohlc } = ctx;
  const rsi = calcRSI(ohlc.map(x => x.close));
  const W = 30;
  for (let i = W; i < n; i++) {
    if (rsi[i] == null) continue;
    // 在窗口内找前一个低点（局部最低收盘价）
    let prevLowIdx = -1, prevLowVal = Infinity;
    for (let j = i - W; j < i - 5; j++) {
      if (j < 0) continue;
      if (ohlc[j].close < prevLowVal) { prevLowVal = ohlc[j].close; prevLowIdx = j; }
    }
    const curLow = ohlc[i].close;
    // 底背离：当前价更低，但RSI更高
    if (prevLowIdx >= 0 && rsi[prevLowIdx] != null && curLow < prevLowVal && rsi[i] > rsi[prevLowIdx]) {
      signals[i] = 'buy';
    }
    // 顶背离：当前价更高，但RSI更低
    let prevHighIdx = -1, prevHighVal = -Infinity;
    for (let j = i - W; j < i - 5; j++) {
      if (j < 0) continue;
      if (ohlc[j].close > prevHighVal) { prevHighVal = ohlc[j].close; prevHighIdx = j; }
    }
    const curHigh = ohlc[i].close;
    if (prevHighIdx >= 0 && rsi[prevHighIdx] != null && curHigh > prevHighVal && rsi[i] < rsi[prevHighIdx]) {
      signals[i] = 'sell'; sellSource[i] = 'orig';
    }
  }
}

// 策略：布林带突破——前日收盘<下轨且当日收盘>下轨（跌破后回升）买入；前日收盘>上轨且当日收盘<上轨（突破后回落）卖出
function signalBollBreak(ctx) {
  const { n, signals, sellSource, closes } = ctx;
  const { upper, lower } = calcBOLL(closes);
  for (let i = 1; i < n; i++) {
    if (upper[i] == null || lower[i] == null || upper[i - 1] == null || lower[i - 1] == null) continue;
    // 跌破下轨后回升
    if (closes[i - 1] < lower[i - 1] && closes[i] > lower[i]) signals[i] = 'buy';
    // 突破上轨后回落
    else if (closes[i - 1] > upper[i - 1] && closes[i] < upper[i]) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：BIAS乖离率——BIAS(6) < -5%（超卖）买入；BIAS(6) > 5%（超买）卖出
function signalBias(ctx) {
  const { n, signals, sellSource, closes } = ctx;
  const bias = calcBIAS(closes, 6);
  for (let i = 1; i < n; i++) {
    if (bias[i] == null) continue;
    if (bias[i] < -5) signals[i] = 'buy';
    else if (bias[i] > 5) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：放量突破——收盘放量突破前N日最高价买入；放量跌破前N日最低价卖出
function signalVolBreakout(ctx) {
  const { n, signals, sellSource, ohlc, vols, vp } = ctx;
  const volMA = calcMA(vols, vp.volN);
  for (let i = 1; i < n; i++) {
    if (volMA[i] == null) continue;
    let hi = -Infinity, lo = Infinity;
    for (let j = Math.max(0, i - vp.volBreakN); j < i; j++) {
      if (ohlc[j].high > hi) hi = ohlc[j].high;
      if (ohlc[j].low < lo) lo = ohlc[j].low;
    }
    const expand = ohlc[i].volume > vp.volMult * volMA[i];
    if (expand && ohlc[i].close > hi) signals[i] = 'buy';
    else if (expand && ohlc[i].close < lo) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：缩量回调——上升趋势(收盘>趋势均线) + 回调(收盘<MA5) + 缩量(量<N日均量×阈值)买入；放量收阴或跌破趋势均线卖出
function signalVolPullback(ctx) {
  const { n, signals, sellSource, ohlc, vols, closes, vp } = ctx;
  const volMA = calcMA(vols, vp.volN);
  const ma5 = calcMA(closes, 5);
  const maTrend = calcMA(closes, vp.volTrendN);
  for (let i = 1; i < n; i++) {
    if (volMA[i] == null || ma5[i] == null || maTrend[i] == null) continue;
    const upTrend = closes[i] > maTrend[i];
    const pullback = closes[i] < ma5[i];
    const shrink = ohlc[i].volume < vp.shrinkMult * volMA[i];
    const expandBear = ohlc[i].volume > vp.volMult * volMA[i] && ohlc[i].close < ohlc[i].open;
    if (upTrend && pullback && shrink) signals[i] = 'buy';
    else if (expandBear || closes[i] < maTrend[i]) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：量比异动——量比≥阈值时，放量收阳买入；放量收阴卖出（量比优先用库中较前日量，缺失则用今日量/昨日量）
function signalVolRatio(ctx) {
  const { n, signals, sellSource, ohlc, vp } = ctx;
  for (let i = 1; i < n; i++) {
    if (ohlc[i].volume <= 0) continue;
    const vr = ohlc[i].volumeRatio != null
      ? ohlc[i].volumeRatio
      : (ohlc[i - 1].volume > 0 ? ohlc[i].volume / ohlc[i - 1].volume : 0);
    if (vr < vp.volRatioBuy) continue;
    if (ohlc[i].close > ohlc[i].open) signals[i] = 'buy';
    else if (ohlc[i].close < ohlc[i].open) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：OBV能量潮——OBV 创前N日新高买入；创前N日新低卖出
function signalObv(ctx) {
  const { n, signals, sellSource, ohlc, vp } = ctx;
  const obv = calcOBV(ohlc);
  for (let i = 1; i < n; i++) {
    let hi = -Infinity, lo = Infinity;
    for (let j = Math.max(0, i - vp.volBreakN); j < i; j++) {
      if (obv[j] > hi) hi = obv[j];
      if (obv[j] < lo) lo = obv[j];
    }
    if (obv[i] > hi) signals[i] = 'buy';
    else if (obv[i] < lo) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：VWAP成交量加权均价——累计(收盘×量)/(累计量)，收盘上穿VWAP买入；下穿卖出
function signalVwap(ctx) {
  const { n, signals, sellSource, closes, vols } = ctx;
  let cumPV = 0, cumV = 0;
  for (let i = 0; i < n; i++) {
    cumPV += closes[i] * vols[i];
    cumV += vols[i];
    if (i === 0) continue;
    const prevPV = cumPV - closes[i] * vols[i];
    const prevV = cumV - vols[i];
    if (prevV <= 0) continue;
    const vwap = cumPV / cumV;
    const vwapPrev = prevPV / prevV;
    if (closes[i - 1] <= vwapPrev && closes[i] > vwap) signals[i] = 'buy';
    else if (closes[i - 1] >= vwapPrev && closes[i] < vwap) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：地量见地价——成交量<均量×阈值（地量）且收阳买入；放量收阴卖出
function signalVolShrink(ctx) {
  const { n, signals, sellSource, ohlc, vols, vp } = ctx;
  const volMA = calcMA(vols, vp.volN);
  for (let i = 1; i < n; i++) {
    if (volMA[i] == null) continue;
    const lowVol = ohlc[i].volume < vp.shrinkMult * volMA[i];
    if (lowVol && ohlc[i].close > ohlc[i].open) signals[i] = 'buy';
    else if (ohlc[i].volume > vp.volMult * volMA[i] && ohlc[i].close < ohlc[i].open) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：量价背离——价创前N日新低但量未创新低（底背离，缩量见底前兆）买入；价创前N日新高但量未创新高（顶背离）卖出
function signalVolDivergence(ctx) {
  const { n, signals, sellSource, ohlc, vp } = ctx;
  const W = vp.volBreakN;
  for (let i = W; i < n; i++) {
    let minClose = Infinity, maxClose = -Infinity, minVol = Infinity, maxVol = -Infinity;
    for (let j = i - W; j < i; j++) {
      if (ohlc[j].close < minClose) minClose = ohlc[j].close;
      if (ohlc[j].close > maxClose) maxClose = ohlc[j].close;
      if (ohlc[j].volume < minVol) minVol = ohlc[j].volume;
      if (ohlc[j].volume > maxVol) maxVol = ohlc[j].volume;
    }
    // 底背离：价创新低但量未同步创新低（有资金承接）
    if (ohlc[i].close < minClose && ohlc[i].volume > minVol) signals[i] = 'buy';
    // 顶背离：价创新高但量未同步放大（动能衰竭）
    else if (ohlc[i].close > maxClose && ohlc[i].volume < maxVol) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略：VR成交量变异率——VR从低位区上穿（超卖回升）买入；从高位区下穿（超买回落）卖出
function signalVr(ctx) {
  const { n, signals, sellSource, ohlc, vp } = ctx;
  const vr = calcVR(ohlc, vp.vrN);
  for (let i = 1; i < n; i++) {
    if (vr[i] == null || vr[i - 1] == null) continue;
    if (vr[i - 1] <= vp.vrBuyThr && vr[i] > vp.vrBuyThr) signals[i] = 'buy';
    else if (vr[i - 1] >= vp.vrSellThr && vr[i] < vp.vrSellThr) { signals[i] = 'sell'; sellSource[i] = 'orig'; }
  }
}

// 策略分发表：strategy 字符串 → 对应的信号生成函数
const STRATEGY_HANDLERS = {
  rate: signalRate,
  cross: signalCross,
  bar: signalBar,
  triple: signalTriple,
  macdRsi: signalMacdRsi,
  macdKdj: signalMacdKdj,
  kdjBottom: signalKdjBottom,
  rsiKdjBottom: signalRsiKdjBottom,
  kdjRsiOverSell: signalKdjRsiOverSell,
  rsiKdjDual: signalRsiKdjDual,
  kdjJ: signalKdjJ,
  rsiDual: signalRsiDual,
  rsiDivergence: signalRsiDivergence,
  bollBreak: signalBollBreak,
  bias: signalBias,
  volBreakout: signalVolBreakout,
  volPullback: signalVolPullback,
  volRatio: signalVolRatio,
  obv: signalObv,
  vwap: signalVwap,
  volShrink: signalVolShrink,
  volDivergence: signalVolDivergence,
  vr: signalVr
};

// 多头空仓补买适用的策略：以 MACD 金叉（DIF>DEA）为核心买入/持仓依据的策略
const BULL_BUY_STRATEGIES = new Set(['cross', 'triple', 'macdRsi', 'macdKdj', 'kdjBottom']);

// ============ 手续费计算 ============
// 买入：佣金 + 过户费；卖出：佣金 + 印花税 + 过户费
function calcFee(turnover, isBuy, feeCfg) {
  const { commissionRate, commissionMin, stampTax, transferFee } = feeCfg;
  // 佣金：按费率计算，不足最低按最低收
  let commission = turnover * commissionRate / 10000;
  if (commission < commissionMin) commission = commissionMin;
  // 印花税：卖出收
  let stamp = isBuy ? 0 : turnover * stampTax / 1000;
  // 过户费：买卖都收
  let transfer = turnover * transferFee / 10000;
  return { commission, stamp, transfer, total: commission + stamp + transfer };
}

// ============ 回测引擎 ============
// 固定金额+分批仓位：买入用可用现金×仓位比例；止盈卖出部分；止损全平；卖出信号全平
// 含 T+1 限制与手续费扣除
function runBacktestEngine(ohlc, macdResult, signals, params) {
  const { initCapital, positionRatio, maxAdds, takeProfit, partialRatio, stopLoss, enableT1, feeCfg } = params;
  const n = ohlc.length;

  let cash = initCapital;
  let shares = 0;
  let avgCost = 0;          // 持仓加权成本（不含手续费的成本价）
  let adds = 0;             // 已进行的买入次数（含首次）
  let partialTaken = false; // 本次持仓是否已止盈减仓
  let lastBuyIdx = -1;      // 最近一次买入的交易日索引（用于T+1判断）
  let totalFee = 0;         // 累计手续费

  const trades = [];        // {date, type, price, shares, amount, fee, cashAfter, reason}
  const equity = new Array(n); // 每日总权益

  // ===== 波段（完整交易循环：建仓→清仓）跟踪 =====
  // cycle: { startIdx, startDate, buyAmount(含费总投入), buyGross(不含费), buyShares, sellAmount(净收回), lastSellPrice, firstTradeIdx(波段内首笔交易索引) }
  let cycle = null;
  const cycles = [];        // 每个已完成/持仓中的波段记录

  // 结算当前波段（isOpen=true 表示回测结束时未平仓，按最后收盘价估算浮盈亏）
  const settleCycle = (endIdx, endDate, reason, isOpen = false) => {
    if (!cycle) return;
    const close = ohlc[endIdx].close;
    const sellPrice = isOpen ? close : cycle.lastSellPrice;
    const pnlNet = isOpen
      ? cycle.sellAmount + shares * close - cycle.buyAmount
      : cycle.sellAmount - cycle.buyAmount;
    // 汇总波段内所有交易：股数、买入/卖出成交额、手续费、剩余现金
    const bandTrades = trades.slice(cycle.firstTradeIdx);
    const buyGross = bandTrades.filter(t => t.type === 'buy').reduce((s, t) => s + t.amount, 0);
    const sellGross = bandTrades.filter(t => t.type === 'sell').reduce((s, t) => s + t.amount, 0);
    const bandFee = bandTrades.reduce((s, t) => s + t.fee, 0);
    const lastTrade = bandTrades[bandTrades.length - 1];
    // 卖出均价 = 卖出成交额(不含费) / 卖出总股数；未平仓波段无卖出，显示最后一笔卖出价或收盘价
    const sellAvgPrice = cycle.sellShares > 0 ? sellGross / cycle.sellShares : sellPrice;
    cycles.push({
      startDate: cycle.startDate,
      endDate,
      holdDays: endIdx - cycle.startIdx,
      avgBuyPrice: cycle.buyShares > 0 ? cycle.buyGross / cycle.buyShares : 0,
      sellPrice,
      sellAvgPrice,       // 波段加权卖出均价（含费后净收回均价由净盈亏体现）
      buyShares: cycle.buyShares,
      buyAmount: cycle.buyAmount,   // 波段买入总投入（含手续费）
      pnl: pnlNet,
      returnPct: cycle.buyAmount > 0 ? pnlNet / cycle.buyAmount : 0,
      reason,
      open: isOpen,
      // 汇总字段
      tradeCount: bandTrades.length,
      buyGross,       // 买入成交额（不含费）
      sellGross,      // 卖出成交额（不含费）
      turnover: buyGross + sellGross,   // 总成交额
      fee: bandFee,   // 波段内总手续费
      cashAfter: lastTrade ? lastTrade.cashAfter : null   // 波段结束后的剩余现金
    });
    cycle = null;
  };
  // 卖出后把净收回金额与卖出股数累计到当前波段
  const accSell = (net, price, soldShares) => {
    if (cycle) { cycle.sellAmount += net; cycle.sellShares += soldShares; cycle.lastSellPrice = price; }
  };

  for (let i = 0; i < n; i++) {
    const k = ohlc[i];
    const close = k.close;

    // T+1判断：当前是否允许卖出（允许卖出的条件：未启用T+1，或当前日 > 最近买入日）
    const canSell = !enableT1 || i > lastBuyIdx;

    // 1. 持仓时先检查止损/止盈（用当日最高/最低价触发）—— 受T+1限制
    if (shares > 0 && canSell) {
      const stopPrice = avgCost * (1 - stopLoss / 100);
      const tpPrice = avgCost * (1 + takeProfit / 100);

      // 止损（优先，保守）：当日最低触及止损价则全平
      if (stopLoss > 0 && k.low <= stopPrice) {
        const sellPrice = stopPrice;
        const gross = sellPrice * shares;
        const fee = calcFee(gross, false, feeCfg);
        const net = gross - fee.total;
        cash += net;
        totalFee += fee.total;
        trades.push({ idx: i, date: k.date, type: 'sell', price: sellPrice, shares, amount: gross, fee: fee.total, cashAfter: cash, reason: `止损(${stopLoss}%)` });
        accSell(net, sellPrice, shares);
        shares = 0;
        avgCost = 0;
        adds = 0;
        partialTaken = false;
        settleCycle(i, k.date, `止损(${stopLoss}%)`);
      } else if (takeProfit > 0 && !partialTaken && k.high >= tpPrice) {
        // 止盈：卖出部分仓位
        const sellShares = Math.floor(shares * partialRatio / 100) * 100;
        const actualSell = sellShares > 0 ? sellShares : Math.floor(shares * partialRatio);
        if (actualSell > 0 && actualSell < shares) {
          const sellPrice = tpPrice;
          const gross = sellPrice * actualSell;
          const fee = calcFee(gross, false, feeCfg);
          const net = gross - fee.total;
          cash += net;
          totalFee += fee.total;
          trades.push({ idx: i, date: k.date, type: 'sell', price: sellPrice, shares: actualSell, amount: gross, fee: fee.total, cashAfter: cash, reason: `止盈(${takeProfit}%)` });
          accSell(net, sellPrice, actualSell);
          shares -= actualSell;
          partialTaken = true;
          // avgCost 不变
        } else if (actualSell >= shares) {
          // 部分卖出数>=持仓，直接全平
          const sellPrice = tpPrice;
          const gross = sellPrice * shares;
          const fee = calcFee(gross, false, feeCfg);
          const net = gross - fee.total;
          cash += net;
          totalFee += fee.total;
          trades.push({ idx: i, date: k.date, type: 'sell', price: sellPrice, shares, amount: gross, fee: fee.total, cashAfter: cash, reason: `止盈(${takeProfit}%)全平` });
          accSell(net, sellPrice, shares);
          shares = 0;
          avgCost = 0;
          adds = 0;
          partialTaken = false;
          settleCycle(i, k.date, `止盈(${takeProfit}%)全平`);
        }
      }
    }

    // 2. 检查策略信号（基于当日收盘MACD，收盘价执行）
    const sig = signals[i];
    // buyBull：多头空仓补买信号，仅在未持仓时执行建仓，不参与加仓
    const isBuy = sig === 'buy' || (sig === 'buyBull' && shares === 0);
    if (isBuy && (shares === 0 || (shares > 0 && adds < maxAdds))) {
      // 买入需预留手续费：估算佣金+过户费，避免资金不足
      const useCash = cash * positionRatio;
      if (useCash > 0) {
        // 买入股数按100股取整（预留手续费：粗估成交额的万分之5）
        const estFeeRate = (feeCfg.commissionRate + feeCfg.transferFee) / 10000;
        let buyShares = Math.floor(useCash / (close * (1 + estFeeRate)) / 100) * 100;
        if (buyShares <= 0) buyShares = Math.floor(useCash / (close * (1 + estFeeRate)));
        if (buyShares > 0) {
          const gross = buyShares * close;
          const fee = calcFee(gross, true, feeCfg);
          const totalCost = gross + fee.total;
          if (totalCost <= cash) {
            const newCost = (avgCost * shares + gross) / (shares + buyShares);
            avgCost = newCost;
            shares += buyShares;
            cash -= totalCost;
            totalFee += fee.total;
            adds++;
            lastBuyIdx = i;
            if (adds === 1) {
              // 首个买入：开启新波段
              cycle = { startIdx: i, startDate: k.date, buyAmount: 0, buyGross: 0, buyShares: 0, sellAmount: 0, sellShares: 0, lastSellPrice: null, firstTradeIdx: trades.length };
            }
            cycle.buyAmount += totalCost;
            cycle.buyGross += gross;
            cycle.buyShares += buyShares;
            const reason = sig === 'buyBull' ? '多头补买' : (adds === 1 ? '首次建仓' : `加仓${adds - 1}`);
            trades.push({ idx: i, date: k.date, type: 'buy', price: close, shares: buyShares, amount: gross, fee: fee.total, cashAfter: cash, reason });
          }
        }
      }
    } else if (sig === 'sell' && shares > 0 && canSell) {
      const gross = close * shares;
      const fee = calcFee(gross, false, feeCfg);
      const net = gross - fee.total;
      cash += net;
      totalFee += fee.total;
      trades.push({ idx: i, date: k.date, type: 'sell', price: close, shares, amount: gross, fee: fee.total, cashAfter: cash, reason: '信号卖出' });
      accSell(net, close, shares);
      shares = 0;
      avgCost = 0;
      adds = 0;
      partialTaken = false;
      settleCycle(i, k.date, '信号卖出');
    }

    equity[i] = cash + shares * close;
  }

  // 最终权益 = 最后一日现金 + 持仓市值（不强制平仓）
  const finalEquity = equity[n - 1];

  // 回测结束仍有持仓：作为未平仓波段记录（浮盈按最后收盘价估算）
  if (cycle && shares > 0) {
    settleCycle(n - 1, ohlc[n - 1].date, '持仓中（未平仓）', true);
  }

  return { trades, equity, cycles, finalEquity, initCapital, totalFee };
}

// ============ 统计指标 ============
function calcMetrics(ohlc, result) {
  const { trades, equity, initCapital, finalEquity, totalFee } = result;
  const n = ohlc.length;

  // 总收益率（已扣手续费）
  const totalReturn = (finalEquity - initCapital) / initCapital;

  // 胜率：以完整交易循环（建仓→清仓）计算净盈亏（含手续费），未平仓波段不计入
  const closedCycles = (result.cycles || []).filter(c => !c.open);
  const cyclePnls = closedCycles.map(c => c.pnl);

  const winCycles = cyclePnls.filter(p => p > 0).length;
  const winRate = cyclePnls.length > 0 ? winCycles / cyclePnls.length : 0;
  const avgWin = winCycles > 0 ? cyclePnls.filter(p => p > 0).reduce((a, b) => a + b, 0) / winCycles : 0;
  const lossCycles = cyclePnls.filter(p => p < 0);
  const avgLoss = lossCycles.length > 0 ? lossCycles.reduce((a, b) => a + b, 0) / lossCycles.length : 0;

  // 最大回撤
  let peak = equity[0] || initCapital;
  let maxDrawdown = 0;
  for (let i = 0; i < n; i++) {
    if (equity[i] > peak) peak = equity[i];
    const dd = (peak - equity[i]) / peak;
    if (dd > maxDrawdown) maxDrawdown = dd;
  }

  // 年化收益率（按交易日计算，约243天/年）
  const years = n / 243;
  const annualReturn = years > 0 ? Math.pow(finalEquity / initCapital, 1 / years) - 1 : 0;

  // 交易次数
  const buyCount = trades.filter(t => t.type === 'buy').length;
  const sellCount = trades.filter(t => t.type === 'sell').length;

  return {
    totalReturn, annualReturn, maxDrawdown,
    winRate, avgWin, avgLoss,
    cycleCount: cyclePnls.length, buyCount, sellCount,
    finalEquity, initCapital, totalFee
  };
}

// ============ K线绘制（带买卖点标记） ============
const klineCharts = {};

// ============ 策略 → 副图指标映射 ============
// 副图描述：{ title, fixed:[min,max]固定Y域, zero:画0轴, refs:[{v,color}]参考线,
//            bars:{data,pos,neg}柱状, lines:[{data,color,name}]折线 }
function buildIndicators(strategy, ohlc, macdResult, sp) {
  const closes = ohlc.map(k => k.close);
  const vols = ohlc.map(k => k.volume);

  // MACD 副图（优先用数据库预计算值）
  const macd = {
    title: 'MACD', zero: true,
    bars: { data: macdResult.macd || [], pos: '#e8453c', neg: '#34a853' },
    lines: [
      { data: macdResult.dif || [], color: '#1a73e8', name: 'DIF' },
      { data: macdResult.dea || [], color: '#ff9800', name: 'DEA' }
    ]
  };
  // RSI 副图（单线）
  const rsi = {
    title: 'RSI', fixed: [0, 100],
    refs: [{ v: 70, color: '#e8453c' }, { v: 50, color: '#bbb' }, { v: 30, color: '#34a853' }],
    lines: [{ data: calcRSI(closes), color: '#8e44ad', name: 'RSI' }]
  };
  // RSI 双线（RSI6/RSI24）
  const rsiDual = {
    title: 'RSI', fixed: [0, 100],
    refs: [{ v: 70, color: '#e8453c' }, { v: 50, color: '#bbb' }, { v: 30, color: '#34a853' }],
    lines: [
      { data: calcRSI(closes, 6), color: '#8e44ad', name: 'RSI6' },
      { data: calcRSI(closes, 24), color: '#1a73e8', name: 'RSI24' }
    ]
  };
  // KDJ 副图（K/D/J 三线）
  const kdjObj = calcKDJ(ohlc);
  const kdj = {
    title: 'KDJ', fixed: [0, 100],
    refs: [{ v: 80, color: '#e8453c' }, { v: 50, color: '#bbb' }, { v: 20, color: '#34a853' }],
    lines: [
      { data: kdjObj.k, color: '#1a73e8', name: 'K' },
      { data: kdjObj.d, color: '#ff9800', name: 'D' },
      { data: kdjObj.j, color: '#8e44ad', name: 'J' }
    ]
  };
  // OBV 副图
  const obv = {
    title: 'OBV', zero: true,
    lines: [{ data: calcOBV(ohlc), color: '#1a73e8', name: 'OBV' }]
  };
  // VR 副图
  const vr = {
    title: 'VR', zero: true,
    refs: [
      { v: sp.volParams.vrBuyThr, color: '#34a853' },
      { v: sp.volParams.vrSellThr, color: '#e8453c' }
    ],
    lines: [{ data: calcVR(ohlc, sp.volParams.vrN), color: '#8e44ad', name: 'VR' }]
  };
  // BIAS 副图
  const bias = {
    title: 'BIAS', zero: true,
    refs: [{ v: 5, color: '#e8453c' }, { v: -5, color: '#34a853' }],
    lines: [{ data: calcBIAS(closes, 6), color: '#1a73e8', name: 'BIAS6' }]
  };
  // BOLL 副图（上/中/下轨）
  const bollObj = calcBOLL(closes);
  const boll = {
    title: 'BOLL',
    lines: [
      { data: bollObj.upper, color: '#e8453c', name: 'UPPER' },
      { data: bollObj.mid, color: '#ff9800', name: 'MID' },
      { data: bollObj.lower, color: '#34a853', name: 'LOWER' }
    ]
  };
  // 成交量副图（柱 + 均量线）
  const vol = {
    title: 'VOL', zero: true,
    bars: { data: vols, pos: '#e8453c', neg: '#34a853' },
    lines: [{ data: calcMA(vols, sp.volParams.volN), color: '#ff9800', name: `VOLMA${sp.volParams.volN}` }]
  };
  // VWAP 副图（VWAP 与收盘价）
  const vwapArr = new Array(closes.length).fill(null);
  let cumPV = 0, cumV = 0;
  for (let i = 0; i < closes.length; i++) {
    cumPV += closes[i] * (vols[i] || 0);
    cumV += vols[i] || 0;
    if (cumV > 0) vwapArr[i] = cumPV / cumV;
  }
  const vwap = {
    title: 'VWAP',
    lines: [
      { data: vwapArr, color: '#8e44ad', name: 'VWAP' },
      { data: closes, color: '#999', name: 'CLOSE' }
    ]
  };

  switch (strategy) {
    case 'rate': case 'cross': case 'bar':
      return [macd];
    case 'triple':
      return [macd, kdj, rsi];
    case 'macdRsi':
      return [macd, rsi];
    case 'macdKdj':
      return [macd, kdj];
    case 'kdjBottom':
      return [kdj, macd];
    case 'rsiKdjBottom': case 'rsiKdjDual':
      return [rsi, kdj];
    case 'kdjRsiOverSell':
      return [kdj, rsi];
    case 'kdjJ':
      return [kdj];
    case 'rsiDual':
      return [rsiDual];
    case 'rsiDivergence':
      return [rsi];
    case 'bollBreak':
      return [boll];
    case 'bias':
      return [bias];
    case 'obv':
      return [obv];
    case 'vr':
      return [vr];
    case 'vwap':
      return [vwap];
    case 'volBreakout': case 'volPullback': case 'volRatio': case 'volShrink': case 'volDivergence':
      return [vol];
    default:
      return [macd];
  }
}

function drawCandlestickWithSignals(canvasId, ohlcData, labels, trades, indicators, instanceKey = 'bt') {
  if (klineCharts[instanceKey]) {
    const old = klineCharts[instanceKey];
    if (old.canvas) {
      old.canvas.onmousemove = null;
      old.canvas.onmouseleave = null;
    }
    delete klineCharts[instanceKey];
  }

  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.parentElement.clientWidth;
  const cssH = canvas.parentElement.clientHeight;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const W = cssW, H = cssH;
  const padL = 44, padR = 44, padT = 10, padB = 24, gap = 12;
  const chartW = W - padL - padR;
  const totalH = H - padT - padB;
  const cnt = indicators ? indicators.length : 0;

  // 副图纵向布局：单图占34%高度，多图按数量均分；主图至少保留180px
  const subGap = 6;
  let subH = cnt > 0 ? Math.max(70, Math.min(160, Math.round(totalH * 0.34 / cnt))) : 0;
  let mainH = totalH - cnt * subH - (cnt - 1) * subGap - gap;
  if (mainH < 180 && cnt > 0) {
    subH = Math.max(56, Math.floor((totalH - gap - 180 - (cnt - 1) * subGap) / cnt));
    mainH = totalH - cnt * subH - (cnt - 1) * subGap - gap;
  }
  const subTops = [];
  let yTop = padT + mainH + gap;
  for (let i = 0; i < cnt; i++) { subTops.push(yTop); yTop += subH + (i < cnt - 1 ? subGap : 0); }

  const allHighs = ohlcData.map(k => k.high);
  const allLows = ohlcData.map(k => k.low);
  // 买卖标记价格也纳入范围
  trades.forEach(t => { allHighs.push(t.price); allLows.push(t.price); });
  let maxP = Math.max(...allHighs);
  let minP = Math.min(...allLows);
  const rangeP = maxP - minP || 1;
  maxP += rangeP * 0.08;
  minP -= rangeP * 0.08;

  const n = ohlcData.length;
  const slot = chartW / n;
  const bodyW = Math.max(2, slot * 0.6);

  const yOf = (price) => padT + (maxP - price) / (maxP - minP) * mainH;
  const xOf = (i) => padL + slot * (i + 0.5);

  // 各副图数值范围（固定域直接使用；否则自动 min/max，zero 副图保证 0 在范围内）
  const subScales = (indicators || []).map(spec => {
    let vals = [];
    (spec.lines || []).forEach(l => l.data.forEach(v => { if (v != null && isFinite(v)) vals.push(v); }));
    if (spec.bars) spec.bars.data.forEach(v => { if (v != null && isFinite(v)) vals.push(v); });
    if (spec.fixed) return { min: spec.fixed[0], max: spec.fixed[1] };
    let min = vals.length ? Math.min(...vals) : 0;
    let max = vals.length ? Math.max(...vals) : 1;
    const r = (max - min) || 1;
    if (spec.zero) {
      if (min > 0) min = 0 - r * 0.15;
      if (max < 0) max = 0 + r * 0.15;
    }
    min -= r * 0.1;
    max += r * 0.1;
    return { min, max };
  });
  const yOfSub = (si, v) => subTops[si] + (subScales[si].max - v) / (subScales[si].max - subScales[si].min) * subH;

  // 按idx分组交易（同一天可能有多次）
  const tradesByIdx = {};
  trades.forEach(t => {
    if (!tradesByIdx[t.idx]) tradesByIdx[t.idx] = [];
    tradesByIdx[t.idx].push(t);
  });

  const instance = { canvas, ctx, ohlcData, labels, trades, tradesByIdx, indicators, subTops, subScales, subH, padL, padR, padT, padB, chartW, mainH, totalH, maxP, minP, n, slot, bodyW, xOf, yOf, yOfSub, hoverIdx: -1, W, H };
  klineCharts[instanceKey] = instance;

  function render() {
    ctx.clearRect(0, 0, W, H);

    // 网格 + Y轴
    ctx.strokeStyle = '#f0f0f0';
    ctx.lineWidth = 1;
    ctx.fillStyle = '#888';
    ctx.font = '10px Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const gridCount = 5;
    for (let i = 0; i <= gridCount; i++) {
      const price = maxP - (maxP - minP) * i / gridCount;
      const y = padT + mainH * i / gridCount;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + chartW, y);
      ctx.stroke();
      ctx.fillText(price.toFixed(2), padL + chartW + 4, y);
    }

    // 悬停十字线（贯穿主图与MACD副图）
    if (instance.hoverIdx >= 0) {
      const hx = xOf(instance.hoverIdx);
      ctx.strokeStyle = '#999';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(hx, padT);
      ctx.lineTo(hx, padT + totalH);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 绘制K线
    ohlcData.forEach((k, i) => {
      const x = xOf(i);
      const isUp = k.close >= k.open;
      const isHover = i === instance.hoverIdx;
      const color = isUp ? '#e8453c' : '#34a853';
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 1;

      // 影线
      ctx.beginPath();
      ctx.moveTo(x, yOf(k.high));
      ctx.lineTo(x, yOf(k.low));
      ctx.stroke();

      // 实体
      const yOpen = yOf(k.open);
      const yClose = yOf(k.close);
      const bodyTop = Math.min(yOpen, yClose);
      const bodyH = Math.max(1, Math.abs(yClose - yOpen));
      const bw = isHover ? bodyW * 1.15 : bodyW;
      ctx.fillRect(x - bw / 2, bodyTop, bw, bodyH);
      ctx.strokeRect(x - bw / 2, bodyTop, bw, bodyH);
    });

    // 绘制买卖点标记
    Object.keys(tradesByIdx).forEach(idxStr => {
      const idx = +idxStr;
      const dayTrades = tradesByIdx[idx];
      const x = xOf(idx);
      const k = ohlcData[idx];
      if (!k) return;

      // 买入：绿色上箭头（在low下方）
      // 卖出：红色下箭头（在high上方）
      let buyY = yOf(k.low) + 14;
      let sellY = yOf(k.high) - 14;
      dayTrades.forEach((t, ti) => {
        if (t.type === 'buy') {
          ctx.fillStyle = '#34a853';
          ctx.strokeStyle = '#34a853';
          ctx.lineWidth = 1.5;
          const ty = buyY + ti * 12;
          // 三角形向上
          ctx.beginPath();
          ctx.moveTo(x, ty - 5);
          ctx.lineTo(x - 5, ty + 3);
          ctx.lineTo(x + 5, ty + 3);
          ctx.closePath();
          ctx.fill();
          // 标签
          ctx.fillStyle = '#34a853';
          ctx.font = 'bold 9px Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText('B', x, ty + 4);
          // 买入点补充首个副图主值
          const pv = indicators && indicators[0] ? (indicators[0].bars ? indicators[0].bars.data[idx] : (indicators[0].lines && indicators[0].lines[0] ? indicators[0].lines[0].data[idx] : null)) : null;
          if (pv != null) {
            ctx.fillStyle = 'rgba(52,168,83,0.75)';
            ctx.font = '8px Consolas, monospace';
            ctx.fillText(pv.toFixed(3), x, ty + 15);
          }
        } else {
          ctx.fillStyle = '#e8453c';
          ctx.strokeStyle = '#e8453c';
          ctx.lineWidth = 1.5;
          const ty = sellY - ti * 12;
          // 三角形向下
          ctx.beginPath();
          ctx.moveTo(x, ty + 5);
          ctx.lineTo(x - 5, ty - 3);
          ctx.lineTo(x + 5, ty - 3);
          ctx.closePath();
          ctx.fill();
          // 标签
          ctx.fillStyle = '#e8453c';
          ctx.font = 'bold 9px Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText('S', x, ty - 4);
          // 卖出点补充首个副图主值
          const pv2 = indicators && indicators[0] ? (indicators[0].bars ? indicators[0].bars.data[idx] : (indicators[0].lines && indicators[0].lines[0] ? indicators[0].lines[0].data[idx] : null)) : null;
          if (pv2 != null) {
            ctx.fillStyle = 'rgba(232,69,60,0.75)';
            ctx.font = '8px Consolas, monospace';
            ctx.fillText(pv2.toFixed(3), x, ty - 15);
          }
        }
      });
    });

    // ===== 绘制副图（通用：柱/折线/参考线/0轴/买卖点） =====
    (indicators || []).forEach((spec, si) => {
      const top = subTops[si];
      const { min, max } = subScales[si];
      const yF = (v) => top + (max - v) / (max - min) * subH;

      // 副图背景与网格（3条水平线）
      ctx.fillStyle = 'rgba(26,115,232,0.02)';
      ctx.fillRect(padL, top, chartW, subH);
      ctx.strokeStyle = '#f0f0f0';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#888';
      ctx.font = '9px Consolas, monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      for (let g = 0; g <= 2; g++) {
        const v = min + (max - min) * g / 2;
        const y = yF(v);
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(padL + chartW, y);
        ctx.stroke();
        ctx.fillText(v.toFixed(spec.fixed ? 0 : 2), padL + chartW + 4, y);
      }
      // 参考线（如 RSI 70/50/30、VR 阈值等）
      (spec.refs || []).forEach(r => {
        if (r.v < min || r.v > max) return;
        const y = yF(r.v);
        ctx.strokeStyle = r.color;
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 2]);
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(padL + chartW, y);
        ctx.stroke();
        ctx.setLineDash([]);
      });
      // 0 轴
      let y0 = top + subH;
      if (spec.zero && min <= 0 && max >= 0) {
        y0 = yF(0);
        ctx.strokeStyle = '#bbb';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padL, y0);
        ctx.lineTo(padL + chartW, y0);
        ctx.stroke();
      }
      // 柱状图（MACD柱/成交量柱，正红负绿）
      if (spec.bars) {
        for (let i = 0; i < n; i++) {
          const v = spec.bars.data[i];
          if (v == null) continue;
          const x = xOf(i);
          const yv = yF(v);
          ctx.fillStyle = v >= 0 ? spec.bars.pos : spec.bars.neg;
          ctx.fillRect(x - bodyW / 2, Math.min(y0, yv), bodyW, Math.max(1, Math.abs(yv - y0)));
        }
      }
      // 折线
      (spec.lines || []).forEach(l => {
        ctx.strokeStyle = l.color;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        let started = false;
        for (let i = 0; i < n; i++) {
          const v = l.data[i];
          if (v == null) { started = false; continue; }
          const x = xOf(i), y = yF(v);
          if (started) ctx.lineTo(x, y);
          else { ctx.moveTo(x, y); started = true; }
        }
        ctx.stroke();
      });

      // 副图买卖点标记（以主值定位，无主值时用0轴/中线）
      const primaryData = spec.bars ? spec.bars.data : ((spec.lines && spec.lines[0]) ? spec.lines[0].data : null);
      ctx.textAlign = 'center';
      Object.keys(tradesByIdx).forEach(idxStr => {
        const idx = +idxStr;
        const dayTrades = tradesByIdx[idx];
        const hasTrade = dayTrades.some(t => t.type === 'buy' || t.type === 'sell');
        if (!hasTrade) return;
        const x = xOf(idx);
        const v = primaryData ? primaryData[idx] : null;
        const yv = v != null ? yF(v) : y0;
        dayTrades.forEach(t => {
          if (t.type === 'buy') {
            const ty = Math.max(y0, yv) + 9;
            ctx.fillStyle = '#34a853';
            ctx.strokeStyle = '#34a853';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(x, ty - 4);
            ctx.lineTo(x - 4, ty + 3);
            ctx.lineTo(x + 4, ty + 3);
            ctx.closePath();
            ctx.fill();
            ctx.font = 'bold 8px Consolas, monospace';
            ctx.textBaseline = 'top';
            ctx.fillText('B', x, ty + 4);
          } else {
            const ty = Math.min(y0, yv) - 9;
            ctx.fillStyle = '#e8453c';
            ctx.strokeStyle = '#e8453c';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(x, ty + 4);
            ctx.lineTo(x - 4, ty - 3);
            ctx.lineTo(x + 4, ty - 3);
            ctx.closePath();
            ctx.fill();
            ctx.font = 'bold 8px Consolas, monospace';
            ctx.textBaseline = 'bottom';
            ctx.fillText('S', x, ty - 4);
          }
        });
      });

      // 副图标题与图例
      ctx.font = '10px Consolas, monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#888';
      ctx.fillText(spec.title, padL, top + 2);
      let lx = padL + 44;
      (spec.lines || []).forEach(l => {
        ctx.fillStyle = l.color;
        ctx.fillText(l.name, lx, top + 2);
        lx += ctx.measureText(l.name).width + 12;
      });
    });

    // X轴日期标签
    ctx.font = '10px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#888';
    const labelStep = Math.max(1, Math.ceil(n / 10));
    for (let i = 0; i < n; i += labelStep) {
      const label = labels[i] || '';
      const shortLabel = label.length > 5 ? label.slice(5) : label;
      ctx.fillText(shortLabel, xOf(i), padT + totalH + 4);
    }

    // 悬停tooltip
    if (instance.hoverIdx >= 0) {
      drawTooltip(instance);
    }
  }

  function drawTooltip(inst) {
    const k = inst.ohlcData[inst.hoverIdx];
    if (!k) return;
    const isUp = k.close >= k.open;
    const color = isUp ? '#e8453c' : '#34a853';
    const change = k.change != null ? k.change : (k.close - k.open);
    const pctChange = k.pctChange != null ? k.pctChange : (k.open ? (k.close - k.open) / k.open * 100 : 0);

    const rows = [
      { label: '日期', value: k.date, color: '#333' },
      { label: '开盘', value: k.open.toFixed(2), color: isUp ? '#e8453c' : '#34a853' },
      { label: '收盘', value: k.close.toFixed(2), color: isUp ? '#e8453c' : '#34a853' },
      { label: '最高', value: k.high.toFixed(2), color: '#e8453c' },
      { label: '最低', value: k.low.toFixed(2), color: '#34a853' },
      { label: '涨跌幅', value: (pctChange >= 0 ? '+' : '') + pctChange.toFixed(2) + '%', color: pctChange >= 0 ? '#e8453c' : '#34a853' },
    ];

    // 当日各副图指标值
    (inst.indicators || []).forEach(spec => {
      (spec.lines || []).forEach(l => {
        const v = l.data[inst.hoverIdx];
        if (v != null) rows.push({ label: l.name, value: v.toFixed(3), color: l.color });
      });
      if (spec.bars) {
        const v = spec.bars.data[inst.hoverIdx];
        if (v != null) rows.push({ label: spec.title, value: v.toFixed(2), color: v >= 0 ? '#e8453c' : '#34a853' });
      }
    });

    // 若当日有交易，附加交易信息
    const dayTrades = inst.tradesByIdx[inst.hoverIdx];
    if (dayTrades) {
      dayTrades.forEach(t => {
        const tag = t.type === 'buy' ? '买入' : '卖出';
        rows.push({ label: `★${tag}`, value: `${t.price.toFixed(2)}×${t.shares}股 (${t.reason})`, color: t.type === 'buy' ? '#34a853' : '#e8453c' });
      });
    }

    const lineH = 16;
    const padX = 10, padY = 8;
    ctx.font = '12px Consolas, monospace';
    let maxLabelW = 0, maxValueW = 0;
    rows.forEach(r => {
      const lw = ctx.measureText(r.label).width;
      const vw = ctx.measureText(r.value).width;
      if (lw > maxLabelW) maxLabelW = lw;
      if (vw > maxValueW) maxValueW = vw;
    });
    const boxW = maxLabelW + maxValueW + 24;
    const boxH = rows.length * lineH + padY * 2;

    const kx = inst.xOf(inst.hoverIdx);
    let bx = kx + 16;
    if (bx + boxW > inst.W - inst.padR) bx = kx - 16 - boxW;
    if (bx < inst.padL) bx = inst.padL;
    let by = inst.padT + 8;
    if (by + boxH > inst.padT + inst.mainH) by = inst.padT + inst.mainH - boxH;

    ctx.fillStyle = 'rgba(255,255,255,0.96)';
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.rect(bx, by, boxW, boxH);
    ctx.fill();
    ctx.stroke();

    ctx.font = '12px Consolas, monospace';
    ctx.textBaseline = 'middle';
    rows.forEach((r, i) => {
      const y = by + padY + i * lineH + lineH / 2;
      ctx.fillStyle = '#888';
      ctx.textAlign = 'left';
      ctx.fillText(r.label, bx + padX, y);
      ctx.fillStyle = r.color;
      ctx.textAlign = 'right';
      ctx.fillText(r.value, bx + boxW - padX, y);
    });
  }

  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    if (mx < padL || mx > padL + chartW || my < padT || my > padT + totalH) {
      if (instance.hoverIdx !== -1) { instance.hoverIdx = -1; render(); }
      return;
    }
    const idx = Math.floor((mx - padL) / slot);
    if (idx >= 0 && idx < n && idx !== instance.hoverIdx) {
      instance.hoverIdx = idx;
      render();
    }
  };
  canvas.onmouseleave = () => {
    if (instance.hoverIdx !== -1) { instance.hoverIdx = -1; render(); }
  };

  render();
}

// ============ 资金曲线 ============
const charts = {};
function renderEquityCurve(canvasId, labels, equity, initCapital, instanceKey = 'equity') {
  if (charts[instanceKey]) { charts[instanceKey].destroy(); delete charts[instanceKey]; }
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;

  charts[instanceKey] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: '总权益',
          data: equity,
          borderColor: '#1a73e8',
          backgroundColor: 'rgba(26,115,232,0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.1,
          pointRadius: 0,
          pointHoverRadius: 4,
        },
        {
          label: '初始资金',
          data: labels.map(() => initCapital),
          borderColor: '#999',
          borderWidth: 1,
          borderDash: [4, 3],
          fill: false,
          pointRadius: 0,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, labels: { font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: (item) => item.dataset.label + ': ' + Number(item.parsed.y).toFixed(2)
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            maxRotation: 45, minRotation: 0, font: { size: 10 }, autoSkip: true, maxTicksLimit: 10,
            callback: function(val) {
              const label = this.getLabelForValue(val);
              if (!label) return '';
              return label.length > 5 ? label.slice(5) : label;
            }
          }
        },
        y: {
          grid: { color: '#f0f0f0' },
          ticks: { font: { size: 10 }, callback: (v) => Number(v).toFixed(0) }
        }
      }
    }
  });
}

// 从策略管理页跳转进入时（backtest.html?load=ID），加载策略参数到表单
// 当前已加载策略的ID（从策略管理页 ?load=ID 进入时记录，用于保存回测结果关联）
let currentStrategyId = null;

// 从策略表动态加载预设策略下拉选项（不再写死在 HTML 中）
async function loadStrategyOptions() {
  const select = document.getElementById('strategySelect');
  try {
    const res = await fetch(`${API_BASE}/api/strategies`);
    const data = await res.json();
    const list = (data.data || []).filter(s => s.is_active !== false);
    if (list.length === 0) {
      select.innerHTML = '<option value="">暂无已保存策略（请到策略管理页创建）</option>';
      return;
    }
    // 下拉 value 只代表策略类型，同名类型去重（API 按创建时间倒序，取最新一条的名称）
    const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const seen = new Set();
    const opts = [];
    for (const s of list) {
      if (seen.has(s.strategy_type)) continue;
      seen.add(s.strategy_type);
      opts.push(`<option value="${esc(s.strategy_type)}">${esc(s.strategy_name)}</option>`);
    }
    select.innerHTML = opts.join('');
    // 默认选中第一条（与旧版默认选中首个策略的行为一致）
    if (!select.value && select.options.length > 0) select.value = select.options[0].value;
  } catch (e) {
    select.innerHTML = '<option value="">策略加载失败，请确认已运行 python server.py</option>';
  }
  updateStrategyDesc();
}

async function loadStrategyFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('load');
  if (!id) return;
  try {
    const res = await fetch(`${API_BASE}/api/strategies`);
    const data = await res.json();
    const item = (data.data || []).find(s => s.id === parseInt(id));
    if (!item) { showError(`未找到策略 id=${id}`); return; }
    currentStrategyId = parseInt(id);
    applyStrategyParams(item.params);
    showInfoModal(`已加载策略「${item.strategy_name}」，参数已填入表单，请拉取数据后运行回测`);
  } catch (e) {
    showError('加载策略失败: ' + e.message);
  }
}

// 回测完成后保存结果到数据库（关联策略ID，供策略管理页展示）
async function saveBacktestResult(ohlc, metrics, cfg) {
  if (!cfg) return;
  const startDate = ohlc[0] ? ohlc[0].date : '';
  const endDate = ohlc[ohlc.length - 1] ? ohlc[ohlc.length - 1].date : '';
  if (!startDate || !endDate) return;
  const payload = {
    strategy_id: currentStrategyId || undefined,
    strategy_name: cfg.strategyName || '未命名策略',
    symbol: cfg.stock.code || cfg.stock.name || '',
    start_date: startDate,
    end_date: endDate,
    initial_capital: metrics.initCapital,
    final_capital: metrics.finalEquity,
    total_return: metrics.totalReturn,
    annual_return: metrics.annualReturn,
    max_drawdown: metrics.maxDrawdown,
    sharpe_ratio: metrics.sharpeRatio || 0,
    win_rate: metrics.winRate,
    total_trades: (metrics.buyCount || 0) + (metrics.sellCount || 0),
    trading_days: ohlc.length,
    total_commission: metrics.totalFee || 0,
    params: { strategy: cfg.strategy, sp: cfg.sp, macd: { fast: cfg.fast, slow: cfg.slow, signal: cfg.signal } },
  };
  try {
    await fetch(`${API_BASE}/api/backtest/result`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch (e) {
    // 保存失败不影响回测展示
    console.warn('保存回测结果失败:', e.message);
  }
}

function fmt(v, decimals = 2) { return Number(v).toFixed(decimals); }
function fmtPct(v, decimals = 2) { return (v >= 0 ? '+' : '') + (v * 100).toFixed(decimals) + '%'; }
function trendModeLabel(mode) {
  return { shortAlign: '均线空头排列(MA20)', shortAlign30: '均线空头排列(MA30)', belowLong: '价格<MA60', ma60Down: 'MA60拐头向下', both: '价<MA60且MA60下行' }[mode] || mode;
}
function fmtMoney(v) {
  if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(2) + '亿';
  if (Math.abs(v) >= 1e4) return (v / 1e4).toFixed(2) + '万';
  return v.toFixed(2);
}

function runBacktest() {
  clearError();
  const ohlc = window.__backtestOhlc;
  if (!ohlc || ohlc.length === 0) { showError('请先拉取股票数据'); return; }
  const { fast, slow, signal } = getParams();
  const sp = getStrategyParams();
  const strategy = document.getElementById('strategySelect').value;
  const stock = window.__backtestStock || { code: '', name: '' };
  if (window.QueryHistory && stock.code) QueryHistory.record(stock.code, stock.name);

  if (fast >= slow) { showError('快线周期必须小于慢线周期'); return; }
  // 量能策略按量能参数校验最少数据量（VR周期/突破周期/趋势均线取最大），否则按MACD慢线
  const VOL_STRATEGIES = ['volBreakout', 'volPullback', 'volRatio', 'obv', 'vwap', 'volShrink', 'volDivergence', 'vr'];
  const minDays = VOL_STRATEGIES.includes(strategy)
    ? Math.max(sp.volParams.volN, sp.volParams.volBreakN, sp.volParams.volTrendN, sp.volParams.vrN) + 2
    : slow + 2;
  if (ohlc.length < minDays) { showError(`数据不足，至少需要 ${minDays} 个交易日，当前 ${ohlc.length} 条`); return; }
  if (sp.positionRatio <= 0 || sp.positionRatio > 1) { showError('买入仓位比例必须在 0~1 之间'); return; }
  if (sp.initCapital < 1000) { showError('初始资金至少1000元'); return; }
  if (sp.flatFilter.enabled && sp.flatFilter.window < 2) { showError('横盘观察天数至少为2'); return; }
  if (sp.fastSell.enabled && sp.fastSell.threshold >= 0) { showError('快速卖出阈值必须为负数'); return; }

  try {
    const closes = ohlc.map(k => k.close);
    // 优先使用数据库基于全量历史预计算的 MACD（值与行情软件一致，零重算）；
    // 仅当用户自定义参数不在库中预置组（12/26/9、6/12/5、3/8/3、10/20/7）时，
    // 才用含预热窗口的完整序列计算（EMA 起点一致），再裁剪回用户范围
    const paramGroups = [
      ['', 12, 26, 9], ['_6_12_5', 6, 12, 5], ['_3_8_3', 3, 8, 3], ['_10_20_7', 10, 20, 7],
    ];
    let macdResult = null;
    const hit = paramGroups.find(([, f, s, g]) => f === fast && s === slow && g === signal);
    if (hit && ohlc[0] && ohlc[0][`macd_dif${hit[0]}`] != null) {
      const suffix = hit[0];
      macdResult = {
        dif: ohlc.map(k => k[`macd_dif${suffix}`]),
        dea: ohlc.map(k => k[`macd_dea${suffix}`]),
        macd: ohlc.map(k => k[`macd_hist${suffix}`]),
      };
    }
    if (!macdResult) {
      const allCloses = window.__backtestAllCloses || closes;
      const warmup = window.__backtestWarmup || 0;
      const macdAll = calcMACD(allCloses, fast, slow, signal);
      macdResult = {
        dif: macdAll.dif.slice(warmup),
        dea: macdAll.dea.slice(warmup),
        macd: macdAll.macd.slice(warmup),
      };
    }
    const signals = generateSignals(strategy, macdResult, ohlc, sp.flatFilter, sp.fastSell, sp.ma5Sell, sp.aboveWaterOnly, sp.buyStrength, sp.trendFilter, sp.volParams, sp.bullBuy);
    const result = runBacktestEngine(ohlc, macdResult, signals, sp);
    const metrics = calcMetrics(ohlc, result);
    const strategyName = (document.querySelector(`#strategySelect option[value="${strategy}"]`) || {}).textContent || strategy;

    renderResults(ohlc, macdResult, result, metrics, { fast, slow, signal, strategy, strategyName, sp, stock });
    saveBacktestResult(ohlc, metrics, { fast, slow, signal, strategy, strategyName, sp, stock });
  } catch (e) {
    showError('回测失败: ' + e.message);
  }
}

  document.getElementById('resultArea').innerHTML = `

        T+1: ${cfg.sp.enableT1 ? '启用' : '关闭'} |

        快速卖出: ${cfg.sp.fastSell.enabled ? `启用(速率<${cfg.sp.fastSell.threshold})` : '关闭'} |
        MA5拐头卖出: ${cfg.sp.ma5Sell.enabled ? '启用' : '关闭'} |
        水上仅死叉: ${cfg.sp.aboveWaterOnly ? '启用' : '关闭'} |
        金叉强度确认: ${cfg.sp.buyStrength.enabled ? `启用(柱≥${cfg.sp.buyStrength.threshold}才买)` : '关闭'} |
        下降趋势过滤: ${cfg.sp.trendFilter.enabled ? `启用(${trendModeLabel(cfg.sp.trendFilter.mode)},延迟补买)` : '关闭'} |
        多头空仓补买: ${cfg.sp.bullBuy ? '启用' : '关闭'} |
        手续费: 佣金${cfg.sp.feeCfg.commissionRate}万(最低${cfg.sp.feeCfg.commissionMin}元) + 印花税${cfg.sp.feeCfg.stampTax}千 + 过户费${cfg.sp.feeCfg.transferFee}万

          <div class="hint">最终权益 ${fmtMoney(m.finalEquity)}</div>
        </div>
        <div class="result-card ${totalReturnClass}">
          <h3>年化收益率</h3>
          <div class="value ${m.annualReturn >= 0 ? 'positive' : 'negative'}">${fmtPct(m.annualReturn)}</div>
          <div class="hint">按243交易日/年</div>
        </div>
        <div class="result-card ${ddClass}">
          <h3>最大回撤</h3>
          <div class="value" style="color:#ff9800">${fmtPct(m.maxDrawdown, 2)}</div>
          <div class="hint">历史权益峰值至谷值</div>
        </div>
        <div class="result-card ${winRateClass}">
          <h3>胜率</h3>
          <div class="value ${m.winRate >= 0.5 ? 'positive' : 'negative'}">${(m.winRate * 100).toFixed(1)}%</div>
          <div class="hint">完整交易循环 ${m.cycleCount} 次</div>
        </div>
        <div class="result-card">
          <h3>买入次数</h3>
          <div class="value" style="color:#34a853">${m.buyCount}</div>
        </div>
        <div class="result-card">
          <h3>卖出次数</h3>
          <div class="value" style="color:#e8453c">${m.sellCount}</div>
        </div>
        <div class="result-card">
          <h3>平均盈利</h3>
          <div class="value positive">${m.avgWin > 0 ? '+' : ''}${fmtMoney(m.avgWin)}</div>
        </div>
        <div class="result-card">
          <h3>平均亏损</h3>
          <div class="value negative">${fmtMoney(m.avgLoss)}</div>
        </div>
        <div class="result-card warn" style="grid-column: span 2">
          <h3>累计手续费</h3>
          <div class="value" style="color:#ff9800">${fmtMoney(m.totalFee)}元</div>
          <div class="hint">占初始资金 ${(m.totalFee / m.initCapital * 100).toFixed(2)}%</div>
        </div>
      </div>

      <div class="chart-wrap">
        <h3>K线图（带买卖点标记）</h3>
        <div class="legend">
          <div class="legend-item"><span class="legend-color" style="background:#e8453c"></span>上涨</div>
          <div class="legend-item"><span class="legend-color" style="background:#34a853"></span>下跌</div>
          <div class="legend-item"><span style="color:#34a853;font-weight:bold">▲B</span>买入</div>
          <div class="legend-item"><span style="color:#e8453c;font-weight:bold">▼S</span>卖出</div>
          <span class="hint">鼠标悬停查看详情</span>
        </div>
        <div class="chart-canvas-wrap"><canvas id="btKline"></canvas></div>
      </div>

      <div class="chart-wrap">
        <h3>资金曲线</h3>
        <div class="chart-canvas-wrap" style="height:260px"><canvas id="btEquity"></canvas></div>
      </div>

      <details open>
        <summary>波段收益明细（共 ${cycles.length} 个波段，已平仓 ${cycles.filter(c => !c.open).length} 个）</summary>
        <table>
          <thead>
            <tr><th>#</th><th>建仓日期</th><th>清仓日期</th><th>持仓天数</th><th>买入均价</th><th>卖出均价</th><th>股数</th><th>投入金额</th><th>成交额</th><th>手续费</th><th>剩余现金</th><th>净盈亏</th><th>收益率</th><th>结果</th><th>清仓原因</th></tr>
          </thead>
          <tbody>
            ${cycles.map((c, i) => {
              const cls = c.open ? 'open-cell' : (c.pnl > 0 ? 'positive' : 'negative');
              const label = c.open ? '持仓中' : (c.pnl > 0 ? '盈利' : '亏损');
              return `
              <tr>
                <td>${i + 1}</td>
                <td>${c.startDate}</td>
                <td>${c.endDate}</td>
                <td>${c.holdDays}</td>
                <td title="加权买入均价（不含手续费）">${fmt(c.avgBuyPrice)}</td>
                <td title="波段内所有卖出的加权均价（含部分止盈，不含手续费）">${c.open ? '-' : fmt(c.sellAvgPrice)}</td>
                <td>${c.buyShares}</td>
                <td title="建仓+加仓的买入总投入（含手续费）">${fmtMoney(c.buyAmount)}</td>
                <td title="买入成交额 + 卖出成交额（均不含手续费）">${fmtMoney(c.turnover)}</td>
                <td style="color:#ff9800">${fmt(c.fee)}</td>
                <td>${c.cashAfter != null ? fmtMoney(c.cashAfter) : '-'}</td>
                <td class="${cls}">${c.pnl >= 0 ? '+' : '-'}${fmtMoney(Math.abs(c.pnl))}</td>
                <td class="${cls}">${fmtPct(c.returnPct)}</td>
                <td class="${cls}" style="font-weight:600">${label}</td>
                <td style="text-align:left">${c.reason}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </details>
    </div>
  `;

  // 渲染K线（带买卖点；副图随策略变化：MACD策略→MACD图，OBV→OBV，RSI→RSI，组合→多图）
  const indicators = buildIndicators(cfg.strategy, ohlc, macdResult, cfg.sp);
  drawCandlestickWithSignals('btKline', ohlc, labels, trades, indicators, 'btKline');
  // 渲染资金曲线
  renderEquityCurve('btEquity', labels, equity, m.initCapital, 'btEquity');
}

// 初始化策略描述
updateStrategyDesc();

// ============ 页面初始化 ============
// 加载本地库 stock_info 股票目录（下拉+输入联想）
loadStockCatalog();
// 先从策略表动态加载策略下拉，再处理从策略管理页跳转（?load=ID）自动加载参数
(async function initStrategies() {
  await loadStrategyOptions();
  await loadStrategyFromUrl();
})();
(function initRangeUI() {
  // 时间段模式默认值：起始=2年前，结束=今天（与「最近2年」对齐）
  const today = new Date();
  const twoYearsAgo = new Date();
  twoYearsAgo.setDate(twoYearsAgo.getDate() - 730);
  const fmtD = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  document.getElementById('begDate').value = fmtD(twoYearsAgo);
  document.getElementById('endDate').value = fmtD(today);
  // 初始化按钮文案和提示
  updateRangeUI();
})();
// 股票输入框回车触发拉取（组件内 input）
document.addEventListener('keydown', (e) => {
  const picker = document.getElementById('stockPicker');
  if (e.key === 'Enter' && picker && picker.contains(e.target)) {
    e.preventDefault();
    fetchStock();
  }
});
</script>
</body>
</html>
